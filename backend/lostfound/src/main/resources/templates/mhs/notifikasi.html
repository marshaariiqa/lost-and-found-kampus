<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/mhs :: shell('Notifikasi', 'notif', 'Notifikasi', 'Kabar terbaru tentang laporan dan klaimmu.', ~{::actions}, ~{::content})}">
<body>
<th:block th:fragment="actions">
  <form th:if="${unreadCount > 0}" th:action="@{/notifikasi/baca-semua}" method="post" class="inline-form">
    <button type="submit" class="btn s"><svg class="ic s16"><use href="#i-check"/></svg>Tandai semua dibaca</button>
  </form>
</th:block>

<th:block th:fragment="content">
  <section class="stack gap16" style="max-width:820px" th:if="${totalNotif > 0}">
    <div class="stack gap8" th:each="g : ${grup}">
      <span class="cap" th:text="${g.key}">Hari ini</span>
      <form th:each="n : ${g.value}" th:action="@{/notifikasi/{id}/buka(id=${n.id})}" method="post">
        <button type="submit" class="card stack gap8" style="width:100%;text-align:left;padding:16px 20px;cursor:pointer"
                th:style="${n.dibaca} ? 'width:100%;text-align:left;padding:16px 20px;cursor:pointer' : 'width:100%;text-align:left;padding:16px 20px;cursor:pointer;background:var(--pink-50);border-color:var(--pink-200)'">
          <span class="row-between">
            <span class="strong" style="font-weight:700" th:text="${n.judul}">Judul</span>
            <span class="hint" th:text="${n.waktu}" style="white-space:nowrap">waktu</span>
          </span>
          <span class="p14" th:text="${n.pesan}">Pesan</span>
          <span class="chips"><span class="badge b-pink" th:unless="${n.dibaca}">Baru</span></span>
        </button>
      </form>
    </div>
  </section>

  <div class="card" th:if="${totalNotif == 0}">
    <div th:replace="~{fragments/ui :: empty('bell', 'Belum ada notifikasi', 'Notifikasi tentang laporan dan klaimmu akan muncul di sini.', '', '')}"></div>
  </div>
</th:block>
</body>
</html>
