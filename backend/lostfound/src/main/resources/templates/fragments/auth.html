<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Panel pink sisi kiri halaman login/registrasi (tanpa data contoh) -->
<aside th:fragment="panel(judul, teks)" class="lp">
  <svg class="deco" viewBox="0 0 700 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <circle cx="620" cy="90" r="190" fill="#fff" fill-opacity=".08"/>
    <circle cx="40" cy="700" r="220" fill="#fff" fill-opacity=".08"/>
    <circle cx="560" cy="560" r="90" fill="#fff" fill-opacity=".06"/>
  </svg>
  <div class="br" style="position:relative">
    <div class="logo" style="border:2px solid rgba(255,255,255,.6)" role="img" aria-label="Logo FindUp!"></div>
    <div><div style="font-size:20px;font-weight:700;line-height:28px">FindUp!</div><div class="sb">Lost &amp; Found FIK UPNVJ</div></div>
  </div>
  <div class="copy">
    <h2 th:text="${judul}">Judul</h2>
    <p th:text="${teks}">Teks</p>
  </div>
</aside>

<!-- Logo Google (resmi) untuk tombol "Masuk dengan Google" -->

  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
</body>
</html>
