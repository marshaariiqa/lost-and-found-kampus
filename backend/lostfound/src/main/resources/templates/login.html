<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lost and Found Kampus</title>
</head>
<body>
    <h1>Login Lost and Found Kampus</h1>

    <p th:if="${param.registered}">
        Registrasi berhasil! Silakan login menggunakan akunmu.
    </p>

    <p th:if="${param.error}">
        Email atau password salah.
    </p>

    <p th:if="${param.logout}">
        Kamu berhasil logout.
    </p>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Email</label>
            <input type="email" id="username" name="username" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <p>Belum punya akun? <a th:href="@{/register}">Daftar di sini</a></p>

    <hr>

    <a th:href="@{/oauth2/authorization/google}">
        Login dengan Google
    </a>
</body>
</html>
