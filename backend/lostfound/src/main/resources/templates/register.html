<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Lost and Found Kampus</title>
</head>
<body>
    <h1>Registrasi Akun</h1>
    <p>Buat akun untuk menggunakan layanan Lost and Found Kampus.</p>

    <p th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" th:object="${pengguna}" method="post">

        <div>
            <label for="namaLengkap">Nama Lengkap</label>
            <input type="text" id="namaLengkap"
                   th:field="*{namaLengkap}" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email"
                   th:field="*{email}" required>
        </div>

        <div>
            <label for="nomorTelepon">Nomor Telepon</label>
            <input type="tel" id="nomorTelepon"
                   th:field="*{nomorTelepon}">
        </div>

        <div>
            <label for="kataSandi">Password</label>
            <input type="password" id="kataSandi"
                   th:field="*{kataSandi}" required minlength="8">
        </div>

        <button type="submit">Daftar</button>
    </form>

    <p>Sudah punya akun? <a th:href="@{/login}">Login di sini</a></p>
</body>
</html>
