<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Terjadi Kesalahan')}"></head>
<body>
<div th:replace="~{fragments/icons :: sprite}"></div>
<main class="rp" style="min-height:100vh">
  <div class="box stack gap16" style="align-items:center;text-align:center">
    <div class="empty" style="padding:0"><div class="ico"><svg class="ic s28"><use href="#i-info"/></svg></div></div>
    <h1 th:text="${status == 404 ? 'Halaman tidak ditemukan' : (status == 403 ? 'Akses ditolak' : 'Terjadi kesalahan')}">Terjadi kesalahan</h1>
    <p class="p14" th:text="${status == 404 ? 'Halaman yang kamu cari tidak ada atau sudah dipindahkan.' : (status == 403 ? 'Kamu tidak memiliki izin untuk membuka halaman ini.' : 'Ada masalah di server. Silakan coba lagi beberapa saat lagi.')}">Pesan</p>
    <a class="btn p" th:href="@{/}">Kembali ke Beranda</a>
  </div>
</main>
<div id="flash" hidden="hidden"></div>
<div id="toast-root" aria-live="polite"></div>
</body>
</html>
