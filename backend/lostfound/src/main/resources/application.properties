# Server Configuration
server.port = 8000

# Database MySQL Configuration (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/db_lost_found?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#Thyemeleaf Cache
spring.thymeleaf.cache=false

# Google OAuth2 Config
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

logging.level.org.springframework.security=INFO
logging.level.lostfound.service.CustomOAuth2UserService=DEBUG

# Sesi berakhir setelah 30 menit TANPA aktivitas (dihitung ulang tiap request).
server.servlet.session.timeout=30m
# cookie.max-age sengaja dihapus: nilai itu membuat sesi mati absolut sejak login,
# bukan berdasarkan ketidakaktifan. Cookie sesi berlaku sampai browser ditutup.

# Upload file (foto barang & foto KTM). Batas 5 MB divalidasi di aplikasi;
# batas Spring sengaja lebih longgar agar pesan error tampil ramah.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Database lokal sudah pernah menjalankan V9__expand_foto_ktm_storage yang tidak ada di project ini.
# Tanpa ini Flyway menolak start karena migrasi V9 "hilang". Kolom foto_ktm sudah diperlebar di DB tersebut.
spring.flyway.ignore-migration-patterns=*:missing,*:future

# Membaca file .env di folder kerja (backend/lostfound/.env) bila ada.
# Catatan: variabel environment OS dengan nama sama MENGALAHKAN isi .env.
spring.config.import=optional:file:.env[.properties]
